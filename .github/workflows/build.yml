# HushMessenger — test + build trên GitHub Actions
#
# Vì sao cần secret PACKAGES_READ_TOKEN (đã xác minh, xem HUONG-DAN.md):
# - Plugin Morphe chỉ phát hành qua GitHub Packages (maven.pkg.github.com/MorpheApp/registry),
#   không có trên Maven Central, và GitHub Packages bắt buộc đăng nhập kể cả với package công khai (HTTP 401 khi không có token).
# - GITHUB_TOKEN tự động của workflow chỉ có quyền với package gắn với chính repository đang chạy workflow.
#   Package của MorpheApp thuộc repository khác nên token tự động KHÔNG đọc được.
# - Cần Personal Access Token (classic) chỉ có scope read:packages của một tài khoản GitHub bất kỳ,
#   lưu vào repo secret tên PACKAGES_READ_TOKEN. Token fine-grained KHÔNG dùng được cho GitHub Packages.
#
# settings.gradle.kts của repo đọc sẵn biến môi trường GITHUB_ACTOR / GITHUB_TOKEN nên workflow
# chỉ việc truyền secret vào đúng hai biến đó cho các bước Gradle.

name: Test and build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PACKAGES_READ_TOKEN secret
        env:
          TOKEN_VALUE: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::Secret PACKAGES_READ_TOKEN chưa được đặt. Tạo PAT (classic) chỉ có scope read:packages rồi lưu vào Settings > Secrets and variables > Actions của fork, đặt tên PACKAGES_READ_TOKEN. Xem HUONG-DAN.md."
            exit 1
          fi
          echo "PACKAGES_READ_TOKEN đã có mặt (không in giá trị)."


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :patches:test tự bỏ qua các test cần bộ APK stock (HUSH_NATIVE_FIXTURES) khi không có fixture.
      # :patches:check KHÔNG chạy ở đây vì nó đòi đủ APK stock của mọi bản Messenger được hỗ trợ.
      - name: Run unit tests (extension + patches)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: ./gradlew :extensions:messenger:testDebugUnitTest :patches:test --no-daemon

      - name: Run script tests (Python)
        run: python3 -m unittest discover -s scripts/tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            extensions/messenger/build/reports/tests/
            extensions/messenger/build/test-results/
            patches/build/reports/tests/
            patches/build/test-results/
          if-no-files-found: ignore

  build:
    name: Build bundle (.mpp)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PACKAGES_READ_TOKEN secret
        env:
          TOKEN_VALUE: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::Secret PACKAGES_READ_TOKEN chưa được đặt. Tạo PAT (classic) chỉ có scope read:packages rồi lưu vào Settings > Secrets and variables > Actions của fork, đặt tên PACKAGES_READ_TOKEN. Xem HUONG-DAN.md."
            exit 1
          fi
          echo "PACKAGES_READ_TOKEN đã có mặt (không in giá trị)."


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bundle tạo ra KHÔNG có chữ ký (không đặt MORPHE_SIGNING_KEY) — đúng như build tay không khoá ký:
      # Morphe Manager vẫn nạp được, chỉ bản phát hành chính thức mới bắt buộc ký.
      - name: Lint + build patches bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: ./gradlew :extensions:messenger:lintRelease :patches:buildAndroid --no-daemon

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: hushmessenger-bundle
          path: patches/build/libs/
          if-no-files-found: error
